<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetaChain Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { background: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gold-text { color: #f3ba2f; }
        .notif-card { background: #f3ba2f; color: #000; padding: 12px; border-radius: 12px; margin-bottom: 8px; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="p-3">
    <div id="notif-container" class="fixed top-5 right-5 z-[9999]"></div>
    <header class="flex justify-between items-center mb-5 px-2">
        <h1 class="text-xl font-black italic uppercase">Zeta<span class="gold-text">Pro</span></h1>
        <button onclick="logout()" class="text-red-500 font-bold text-[9px]">LOGOUT</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-3 space-y-4">
            <div class="glass rounded-3xl p-5 text-center">
                <div id="qrcode" class="bg-white p-2 rounded-xl inline-block mb-3"></div>
                <p id="user-addr" class="text-[8px] font-mono opacity-40 truncate"></p>
                <button onclick="copyAddr()" class="w-full mt-3 py-2 bg-white/5 rounded-lg text-[9px] font-bold">SALIN ALAMAT</button>
            </div>
        </div>

        <div class="lg:col-span-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass rounded-3xl p-5">
                    <p class="text-[9px] opacity-50 uppercase font-bold">Saldo Aktif</p>
                    <h2 class="text-3xl font-black italic"><span id="balance">0.00</span> <span class="text-xs gold-text">ZETA</span></h2>
                </div>
                <div class="glass rounded-3xl p-4">
                    <input id="to-addr" type="text" placeholder="Wallet Tujuan 0x..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-[10px] mb-2 outline-none">
                    <div class="flex gap-2">
                        <input id="send-amt" type="number" placeholder="0.0" class="w-20 bg-white/5 border border-white/10 rounded-xl p-2 text-xs">
                        <button onclick="sendZeta()" class="flex-1 bg-[#f3ba2f] text-black font-black rounded-xl text-[10px] uppercase italic">Kirim</button>
                    </div>
                </div>
            </div>
            <div class="glass rounded-3xl p-1 h-[400px]">
                <div id="tradingview_chart" class="h-full w-full"></div>
            </div>
        </div>

        <div class="lg:col-span-3 glass rounded-3xl p-5 h-[550px] flex flex-col">
            <h3 class="text-[9px] font-bold opacity-30 mb-4 uppercase">Riwayat Transaksi</h3>
            <div id="tx-history" class="overflow-y-auto space-y-3"></div>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        firebase.initializeApp(APP_CONFIG.firebase);
        const db = firebase.firestore();
        const userAddress = localStorage.getItem('userWallet');
        if (!userAddress) window.location.href = "index.html";
        document.getElementById('user-addr').innerText = userAddress;

        new QRCode(document.getElementById("qrcode"), { text: userAddress, width: 110, height: 110 });

        function showNotif(m) {
            const e = document.createElement('div'); e.className = 'notif-card shadow-lg'; e.innerText = m;
            document.getElementById('notif-container').appendChild(e);
            setTimeout(() => e.remove(), 4000);
        }

        async function updateBalance() {
            try {
                const provider = new ethers.JsonRpcProvider(APP_CONFIG.network.rpcUrl);
                const bal = await provider.getBalance(userAddress);
                document.getElementById('balance').innerText = parseFloat(ethers.formatEther(bal)).toFixed(4);
            } catch (e) { console.error("Update balance error"); }
        }

        async function sendZeta() {
            const to = document.getElementById('to-addr').value;
            const amt = document.getElementById('send-amt').value;
            if(!ethers.isAddress(to) || !amt) return alert("Data tidak valid");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const totalWei = ethers.parseEther(amt);
                const feeWei = (totalWei * BigInt(Math.floor(APP_CONFIG.serviceFee * 100))) / BigInt(100);
                
                showNotif("PROSES TRANSFER...");
                const tx = await signer.sendTransaction({ to: to, value: totalWei - feeWei });
                
                // Kirim fee admin
                await signer.sendTransaction({ to: APP_CONFIG.adminWallet, value: feeWei });
                
                await tx.wait();
                await db.collection("trades").add({ user: userAddress, to: to, amount: amt, time: firebase.firestore.FieldValue.serverTimestamp() });
                showNotif("PENGIRIMAN BERHASIL!");
                updateBalance();
            } catch (e) { alert("Saldo tidak cukup atau dibatalkan."); }
        }

        db.collection("trades").where("user", "==", userAddress).orderBy("time", "desc").limit(10).onSnapshot(s => {
            const cont = document.getElementById('tx-history'); cont.innerHTML = '';
            s.forEach(doc => {
                const d = doc.data();
                cont.innerHTML += `<div class="p-3 bg-white/5 rounded-xl border border-white/5">
                    <div class="flex justify-between font-bold text-yellow-500"><span>SEND</span><span>${d.amount} ZETA</span></div>
                    <p class="text-[7px] opacity-30 truncate">${d.to}</p>
                </div>`;
            });
        });

        new TradingView.widget({ "autosize": true, "symbol": "BINANCE:BTCUSDT", "theme": "dark", "container_id": "tradingview_chart" });
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
        function copyAddr() { navigator.clipboard.writeText(userAddress); showNotif("ALAMAT DISALIN!"); }
        
        updateBalance(); 
        setInterval(updateBalance, 15000);
    </script>
</body>
</html>
