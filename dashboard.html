<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZetaChain Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100vh; }
        .bg-card { background: #0f0f0f; border: 1px solid #1a1a1a; }
        .main-content { height: calc(100vh - 75px); overflow-y: auto; padding-bottom: 60px; }
        .gold-text { color: #f3ba2f; }
        .gold-bg { background: #f3ba2f; color: #000; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #0a0a0a; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #444; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .nav-item.active { color: #f3ba2f; }
        
        #chartContainer { width: 100%; height: 230px; position: relative; background: #000; margin: 10px 0; }
        #live-tag { position: absolute; right: 0; padding: 2px 8px; font-weight: 900; font-size: 9px; color: #000; z-index: 20; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .market-chip { flex-shrink: 0; padding: 8px 16px; border-radius: 12px; border: 1px solid #1a1a1a; font-size: 10px; font-weight: 800; }
        .market-chip.active { background: #f3ba2f; color: #000; border-color: #f3ba2f; }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="p-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gold-bg rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <p id="u-status-kyc" class="text-[7px] text-gray-500 font-bold uppercase tracking-widest">Checking...</p>
                    <h2 id="u-email" class="text-xs font-black italic gold-text uppercase">Loading...</h2>
                </div>
            </div>
            <button onclick="location.href='setting-akun.html'" class="text-gray-500"><i class="fa-solid fa-gear text-lg"></i></button>
        </div>

        <div class="px-6">
            <div class="bg-card p-5 rounded-[1.5rem] border-l-4 border-yellow-500 shadow-xl">
                <p class="text-[8px] text-gray-500 font-black uppercase tracking-widest">Total Equity Value</p>
                <h3 id="u-balance-akun" class="text-2xl font-black italic tracking-tighter">Rp 0</h3>
            </div>
        </div>

        <div class="px-6 mt-6">
            <div class="flex gap-4 overflow-x-auto no-scrollbar">
                <button onclick="changeMarket('crypto')" id="tab-crypto" class="market-chip active italic">CRYPTO ASSETS</button>
                <button onclick="changeMarket('forex')" id="tab-forex" class="market-chip italic">FOREX / FX</button>
            </div>
            <div id="coin-list" class="flex gap-2 mt-3 overflow-x-auto no-scrollbar"></div>
        </div>

        <div id="chartContainer">
            <div class="absolute top-2 left-6 z-10">
                <h4 id="active-coin-name" class="text-lg font-black italic gold-text tracking-tighter">BTC/USDT</h4>
            </div>
            <canvas id="mainChart"></canvas>
            <div id="live-tag">Rp 0</div>
        </div>

        <div class="px-6 grid grid-cols-4 gap-3">
            <div onclick="location.href='topup.html'" class="flex flex-col items-center gap-1.5 cursor-pointer">
                <div class="w-full aspect-square bg-card rounded-2xl flex items-center justify-center text-yellow-500"><i class="fa-solid fa-wallet"></i></div>
                <span class="text-[7px] font-bold text-gray-400 uppercase">Deposit</span>
            </div>
            <div onclick="location.href='bursa-pasar.html'" class="flex flex-col items-center gap-1.5 cursor-pointer">
                <div class="w-full aspect-square bg-card rounded-2xl flex items-center justify-center text-green-500"><i class="fa-solid fa-chart-line"></i></div>
                <span class="text-[7px] font-bold text-gray-400 uppercase">Market</span>
            </div>
            <div onclick="location.href='future-trade.html'" class="flex flex-col items-center gap-1.5 cursor-pointer">
                <div class="w-full aspect-square bg-card rounded-2xl flex items-center justify-center text-red-500"><i class="fa-solid fa-bolt"></i></div>
                <span class="text-[7px] font-bold text-gray-400 uppercase">Futures</span>
            </div>
            <div onclick="location.href='kyc.html'" class="flex flex-col items-center gap-1.5 cursor-pointer">
                <div class="w-full aspect-square bg-card rounded-2xl flex items-center justify-center text-cyan-500"><i class="fa-solid fa-id-card"></i></div>
                <span class="text-[7px] font-bold text-gray-400 uppercase">KYC</span>
            </div>
        </div>

        <div class="px-6 mt-8">
            <h4 class="text-[10px] font-black italic gold-text tracking-widest mb-4 uppercase">Live Transactions</h4>
            <div id="history-container" class="space-y-3"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i><span>Beranda</span></div>
        <div onclick="location.href='bursa-pasar.html'" class="nav-item"><i class="fa-solid fa-shuffle"></i><span>Trade</span></div>
        <div onclick="location.href='profil.html'" class="nav-item"><i class="fa-solid fa-user"></i><span>Profil</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDrpBJTtankyLgimtOwuriFpiyuC5K10OI", 
            authDomain: "studio-727777898-40aea.firebaseapp.com", 
            projectId: "studio-727777898-40aea", 
            appId: "1:351263967108:web:a0c01af41422903cc17fd1" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // DATA MARKET
        const markets = {
            crypto: ["BTC", "ETH", "SOL", "BNB", "TRX", "DOGE"],
            forex: ["EUR/USD", "GBP/USD", "USD/JPY", "XAU/USD", "AUD/USD"]
        };
        let currentType = 'crypto';
        let currentCoin = localStorage.getItem('selectedCoin') || "BTC";

        // PROTEKSI LOGIN GANDA (Fix Auto-Back)
        onAuthStateChanged(auth, (user) => {
            const walletUser = localStorage.getItem('walletAddress');
            if (!user && !walletUser) {
                window.location.href = "login.html";
            } else if (user) {
                setupUser(user.uid);
            }
        });

        function setupUser(uid) {
            onSnapshot(doc(db, "users", uid), (snap) => {
                const d = snap.data();
                if(d) {
                    document.getElementById('u-email').innerText = (d.email || "USER").split('@')[0].toUpperCase();
                    document.getElementById('u-balance-akun').innerText = "Rp " + (d.balance || 0).toLocaleString('id-ID');
                    document.getElementById('u-status-kyc').innerText = (d.kyc_status || 'UNVERIFIED').toUpperCase() + " TRADER";
                }
            });
        }

        window.changeMarket = (type) => {
            currentType = type;
            document.getElementById('tab-crypto').classList.toggle('active', type === 'crypto');
            document.getElementById('tab-forex').classList.toggle('active', type === 'forex');
            renderCoins();
        };

        function renderCoins() {
            const list = document.getElementById('coin-list');
            list.innerHTML = "";
            markets[currentType].forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl border border-white/10 text-[9px] font-bold flex-shrink-0 ${c === currentCoin ? 'bg-yellow-500 text-black' : 'bg-card text-gray-500'}`;
                btn.innerText = c;
                btn.onclick = () => { localStorage.setItem('selectedCoin', c); location.reload(); };
                list.appendChild(btn);
            });
        }

        // --- GRAPH ENGINE ---
        const canvas = document.getElementById('mainChart');
        const ctx = canvas.getContext('2d');
        const tag = document.getElementById('live-tag');
        document.getElementById('active-coin-name').innerText = currentCoin;

        let prices = Array.from({length: 60}, () => 500000 + (Math.random()-0.5)*10000);

        function draw() {
            if(!canvas.offsetWidth) return;
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const min = Math.min(...prices) * 0.998;
            const max = Math.max(...prices) * 1.002;
            const stepX = canvas.width / (prices.length - 1);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isBull = prices[prices.length-1] >= prices[prices.length-2];
            const color = isBull ? "#22c55e" : "#ef4444";

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            prices.forEach((p, i) => {
                const x = i * stepX;
                const y = canvas.height - ((p - min) / (max - min) * canvas.height);
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                if(i === prices.length - 1) {
                    tag.style.top = (y - 10) + "px";
                    tag.style.backgroundColor = color;
                    tag.innerText = (currentType === 'crypto' ? "Rp " : "$ ") + p.toLocaleString('id-ID');
                }
            });
            ctx.stroke();
        }

        setInterval(() => {
            let last = prices[prices.length-1];
            prices.push(last + (Math.random()-0.5)*2000);
            prices.shift();
            draw();
        }, 1000);

        renderCoins();
    </script>
</body>
</html>
