<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetaChain Pro | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@5.1.11/dist/index.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .gold-bg { background: linear-gradient(135deg, #f3ba2f 0%, #ffdb4d 100%); color: black; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-sm text-center">
        <div class="mb-10">
            <div class="w-20 h-20 gold-bg rounded-[2rem] flex items-center justify-center text-4xl mx-auto mb-6 shadow-[0_0_50px_rgba(243,186,47,0.3)]">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">ZetaChain <span class="text-[#f3ba2f] text-xl">PRO</span></h1>
        </div>
        <button id="btn-connect" onclick="handleConnect()" class="w-full py-4 gold-bg rounded-2xl font-black italic uppercase text-sm shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-transform">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span id="status-text">Hubungkan Wallet</span>
        </button>
    </div>

    <script>
        let modal;

        // Fungsi inisialisasi otomatis
        async function init() {
            if (localStorage.getItem('userWallet')) {
                window.location.href = "dashboard.html";
                return;
            }
            
            try {
                modal = Web3ModalEthers.createWeb3Modal({
                    ethersConfig: Web3ModalEthers.defaultConfig({
                        metadata: { 
                            name: 'ZetaChain Pro', 
                            url: 'https://zeta-relay-vintage.vercel.app' 
                        }
                    }),
                    chains: [{
                        chainId: 7000,
                        name: 'ZetaChain',
                        currency: 'ZETA',
                        explorerUrl: 'https://explorer.zetachain.com',
                        rpcUrl: APP_CONFIG.network.rpcUrl
                    }],
                    projectId: APP_CONFIG.projectId
                });
            } catch (e) {
                console.error("Gagal memuat modal:", e);
            }
        }

        async function handleConnect() {
            const statusText = document.getElementById('status-text');
            if (!modal) {
                statusText.innerText = "Mencoba ulang...";
                await init();
                if (!modal) return alert("Sistem belum siap. Periksa koneksi internet Anda.");
            }

            try {
                statusText.innerText = "Membuka Wallet...";
                await modal.open();
                
                const check = setInterval(() => {
                    if (modal.getIsConnected()) {
                        clearInterval(check);
                        localStorage.setItem('userWallet', modal.getAddress());
                        window.location.href = "dashboard.html";
                    }
                }, 1000);
            } catch (e) {
                statusText.innerText = "Hubungkan Wallet";
                alert("Koneksi dibatalkan");
            }
        }

        init(); // Jalankan inisialisasi saat script dimuat
    </script>
</body>
</html>
